services:
  - type: web
    name: dnd-web-trpg
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # 在 Render 控制台填入实际值,不要写进仓库
      - key: MINIMAX_API_KEY
        sync: false
